services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: shopkart
      POSTGRES_PASSWORD: shopkart
      POSTGRES_DB: shopkart
    ports:
        - "127.0.0.1:5433:5432"
    volumes:
        - pgdata:/var/lib/postgresql
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U shopkart -d shopkart"]
        interval: 5s
        timeout: 5s
        retries: 10
volumes:
    pgdata:
